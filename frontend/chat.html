<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>CampusVault — Chat</title>

  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/pages/chat.css" />
</head>
<body>
  <header class="cv-header-small">
    <div class="cv-header-inner">
      <a class="cv-back" href="dashboard.html">&larr; Back</a>
      <h1>Chat</h1>
      <div></div>
    </div>
  </header>

  <main class="cv-container">
    <section class="cv-card">
      <div id="chat-area" class="cv-chat-area">
        <div id="chat-messages" class="cv-chat-messages" aria-live="polite"></div>

        <form id="chat-form" class="cv-chat-form" aria-label="Send message">
          <input id="chat-input" type="text" placeholder="Type a message..." autocomplete="off" required />
          <button class="cv-btn" type="submit">Send</button>
        </form>
      </div>
    </section>
  </main>

  <script src="js/config.js"></script>
  <script src="js/lib/dom.js"></script>
  <script src="js/api.js"></script>
  <script src="js/state.js"></script>
  <script src="js/ui.js"></script>

  <script src="js/components/chatWidget.js"></script>
  <script src="js/pages/chat.page.js"></script>
</body>
</html>
