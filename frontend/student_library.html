<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>CampusVault — Library</title>

  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/pages/library.css" />
</head>
<body>
  <header class="cv-header-small">
    <div class="cv-header-inner">
      <a class="cv-back" href="student-dashboard.html">&larr; Back</a>
      <h1>Library</h1>
      <div></div>
    </div>
  </header>

  <main class="cv-container">
    <section class="cv-card">
      <form id="library-filter" class="cv-inline-form">
        <input id="q" type="search" placeholder="Search by title, tag or faculty" />
        <select id="filter-type"><option value="">All types</option><option value="pdf">PDF</option><option value="pptx">PPTX</option><option value="xlsx">EXCEL</option><option value="docx">DOCX</option></select>
        <button id="search-btn" class="cv-btn">Search</button>
      </form>
    </section>

    <section class="cv-card">
      <div id="library-list" class="cv-grid"></div>
      <div id="library-pager" class="cv-pager"></div>
    </section>
  </main>

  <script type="module" src="js/config.js"></script>
  <script type="module" src="js/lib/dom.js"></script>
  <script type="module" src="js/api.js"></script>
  <script type="module" src="js/state.js"></script>
  <script type="module" src="js/ui.js"></script>
  <script type="module" src="js/components/paginator.js"></script>
  <script type="module" src="js/components/fileCard.js"></script>
  <script type="module" src="js/pages/library.page.js"></script>
</body>
</html>
