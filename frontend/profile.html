<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>CampusVault — Profile</title>

  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/pages/profile.css" />
</head>
<body>
  <header class="cv-header-small">
    <div class="cv-header-inner">
      <a class="cv-back" href="dashboard.html">&larr; Back</a>
      <h1>Profile</h1>
      <div></div>
    </div>
  </header>

  <main class="cv-container">
    <!-- Top card: avatar + primary info -->
    <section class="cv-card" id="profile-top">
      <div style="display:flex; gap:18px; align-items:center; flex-wrap:wrap;">
        <div style="min-width:96px; text-align:center;">
          <div id="profile-avatar" style="width:96px;height:96px;border-radius:12px;overflow:hidden;background:#e9f2ff;display:flex;align-items:center;justify-content:center;font-weight:700;color:#0f67d3;">
            <!-- JS may insert <img> here or initials -->
            <span id="profile-initials">AD</span>
          </div>
          <label for="profile-avatar-input" class="cv-small" style="display:block;margin-top:8px;cursor:pointer;">Change photo</label>
          <input id="profile-avatar-input" type="file" accept="image/*" style="display:none" />
        </div>

        <div style="flex:1; min-width:220px;">
          <h2 id="profile-display-name" style="margin:0 0 6px 0; font-size:20px">Your name</h2>
          <div id="profile-role" class="cv-small" style="margin-bottom:8px;">Role: <strong>student</strong></div>
          <div id="profile-bio" class="cv-small" style="color:#274060">Short bio or tagline goes here — set in signup.</div>
        </div>

        <div style="display:flex; gap:10px; align-items:center;">
          <button id="profile-edit" class="cv-btn">Edit</button>
          <button id="profile-logout" class="cv-btn" type="button">Log out</button>
        </div>
      </div>
    </section>

    <!-- Two-column layout: left = form/editable, right = summary/read-only -->
    <section class="cv-card" style="display:grid; grid-template-columns:1fr 320px; gap:18px; margin-top:18px;">
      <!-- Left: editable profile form -->
      <form id="profile-form" class="cv-form" novalidate autocomplete="off">
        <!-- Row 1 -->
        <label class="cv-field">
          <span class="cv-label">Full name</span>
          <input id="profile-name" data-field="name" name="name" type="text" required />
        </label>

        <label class="cv-field">
          <span class="cv-label">Email</span>
          <input id="profile-email" data-field="email" name="email" type="email" required />
        </label>

        <!-- Row 2 -->
        <label class="cv-field">
          <span class="cv-label">Phone</span>
          <input id="profile-phone" data-field="phone" name="phone" type="tel" placeholder="+91 9xxxxxxxxx" />
        </label>

        <label class="cv-field">
          <span class="cv-label">Role</span>
          <select id="profile-role-select" data-field="role" name="role" aria-label="role">
            <option value="student">Student</option>
            <option value="faculty">Faculty</option>
            <option value="staff">Staff</option>
          </select>
        </label>

        <!-- Row 3: academic -->
        <label class="cv-field">
          <span class="cv-label">College / Institution</span>
          <input id="profile-college" data-field="college" name="college" type="text" />
        </label>

        <label class="cv-field">
          <span class="cv-label">Department / Major</span>
          <input id="profile-department" data-field="department" name="department" type="text" />
        </label>

        <!-- Row 4: course year / reg -->
        <label class="cv-field">
          <span class="cv-label">Program / Degree</span>
          <input id="profile-degree" data-field="degree" name="degree" type="text" placeholder="B.Sc, B.Tech, M.Sc, etc." />
        </label>

        <label class="cv-field">
          <span class="cv-label">Year / Semester</span>
          <input id="profile-year" data-field="year" name="year" type="text" placeholder="2nd year / Semester 4" />
        </label>

        <label class="cv-field">
          <span class="cv-label">Registration / Roll number</span>
          <input id="profile-reg" data-field="registration" name="registration" type="text" />
        </label>

        <!-- Row 5: socials -->
        <label class="cv-field">
          <span class="cv-label">GitHub</span>
          <input id="profile-github" data-field="github" name="github" type="url" placeholder="https://github.com/username" />
        </label>

        <label class="cv-field">
          <span class="cv-label">LinkedIn</span>
          <input id="profile-linkedin" data-field="linkedin" name="linkedin" type="url" placeholder="https://www.linkedin.com/in/..." />
        </label>

        <!-- Row 6: address & bio -->
        <label class="cv-field" style="grid-column: 1 / -1;">
          <span class="cv-label">Address</span>
          <input id="profile-address" data-field="address" name="address" type="text" />
        </label>

        <label class="cv-field" style="grid-column: 1 / -1;">
          <span class="cv-label">About / Bio</span>
          <textarea id="profile-about" data-field="bio" name="bio" rows="4" style="resize:vertical;padding:10px;border-radius:8px;border:1px solid #d9e8ff;"></textarea>
        </label>

        <!-- Row 7: change password -->
        <label class="cv-field" style="grid-column: 1 / -1;">
          <span class="cv-label">Change password</span>
          <input id="profile-password" data-field="password" name="password" type="password" placeholder="New password (leave blank to keep)" />
        </label>

        <div class="cv-actions" style="grid-column:1 / -1;">
          <button id="profile-save" class="cv-btn cv-btn-primary" type="submit">Save</button>
          <button id="profile-cancel" class="cv-btn" type="button">Cancel</button>
          <span id="profile-status" class="cv-small" aria-live="polite"></span>
        </div>
      </form>

      <!-- Right: summary / signup details (read-only) -->
      <aside id="profile-summary" style="min-width:260px;">
        <h3 style="margin-top:0;">Account summary</h3>

        <dl style="margin:10px 0 0 0; line-height:1.6;">
          <div>
            <dt class="cv-small">Full name</dt>
            <dd id="summary-name"></dd>
          </div>

          <div>
            <dt class="cv-small">Email</dt>
            <dd id="summary-email"></dd>
          </div>

          <div>
            <dt class="cv-small">Phone</dt>
            <dd id="summary-phone"></dd>
          </div>

          <div>
            <dt class="cv-small">Role</dt>
            <dd id="summary-role"></dd>
          </div>

          <div>
            <dt class="cv-small">College</dt>
            <dd id="summary-college"></dd>
          </div>

          <div>
            <dt class="cv-small">Department</dt>
            <dd id="summary-department"></dd>
          </div>

          <div>
            <dt class="cv-small">Program</dt>
            <dd id="summary-degree"></dd>
          </div>

          <div>
            <dt class="cv-small">Year</dt>
            <dd id="summary-year"></dd>
          </div>

          <div>
            <dt class="cv-small">Registration</dt>
            <dd id="summary-registration"></dd>
          </div>

          <div>
            <dt class="cv-small">GitHub</dt>
            <dd id="summary-github"></dd>
          </div>

          <div>
            <dt class="cv-small">LinkedIn</dt>
            <dd id="summary-linkedin"></dd>
          </div>

          <div>
            <dt class="cv-small">Bio</dt>
            <dd id="summary-bio" style="white-space:pre-wrap"></dd>
          </div>

          <div style="margin-top:12px;">
            <button id="profile-download-json" class="cv-btn" type="button">Download JSON</button>
          </div>
        </dl>
      </aside>
    </section>

    <!-- Optional: raw debug JSON (hidden by default, useful in dev) -->
    <section id="profile-debug" class="cv-card" style="display:none; margin-top:18px;">
      <h4>Raw profile payload</h4>
      <pre id="profile-json" style="max-height:220px; overflow:auto; background:#f7fbff; padding:10px; border-radius:8px;"></pre>
    </section>
  </main>

  <script type="module" src="js/config.js"></script>
  <script type="module" src="js/lib/dom.js"></script>
  <script type="module" src="js/api.js"></script>
  <script type="module" src="js/state.js"></script>
  <script type="module" src="js/ui.js"></script>

  <script type="module" src="js/pages/profile.page.js"></script>
</body>
</html>
