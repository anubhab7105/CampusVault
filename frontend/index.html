<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>CampusVault — Login</title>

  <!-- Global styles -->
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <!-- Page styles -->
  <link rel="stylesheet" href="css/pages/login.css" />
</head>
<body>
  <main class="cv-container cv-center">
    <section class="cv-card cv-login-card" id="login-card" aria-labelledby="login-heading">
      <img class="cv-logo" src="assets/logo.jpg" alt="CampusVault" />
      <!-- <h1 id="login-heading">CampusVault</h1> -->

      <form id="login-form" class="cv-form" novalidate>
        <label class="cv-field">

        <label class="cv-field">
          <span class="cv-label">Site ID</span>
          <input id="siteid" name="siteid" type="text" autocomplete="username" required />
        </label>

        <label class="cv-field">
          <span class="cv-label">Password</span>
          <input id="password" type="password" required autocomplete="current-password" />
        </label>

        <div class="cv-actions">
          <button type="submit" class="cv-btn cv-btn-primary">Login</button>
        </div>

        <p class="cv-small">Demo: admin@college.edu / adminpass</p>
      </form>

      <p class="cv-small">Haven't registered? <a href="signup.html">Login here</a></p>

      <div id="login-error" role="alert" class="cv-error" aria-live="polite"></div>
    </section>
  </main>

  <!-- Shared scripts (ES modules) -->
  <script type="module" src="js/config.js"></script>
  <script type="module" src="js/lib/dom.js"></script>
  <script type="module" src="js/api.js"></script>
  <script type="module" src="js/state.js"></script>
  <script type="module" src="js/auth.js"></script>
  <script type="module" src="js/ui.js"></script>

  <!-- Page controller -->
  <script type="module" src="js/pages/login.page.js"></script>
</body>
</html>
