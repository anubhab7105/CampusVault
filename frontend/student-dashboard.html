<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>CampusVault — Student Dashboard</title>

  <!-- Global styles -->
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />

  <!-- Page styles -->
  <link rel="stylesheet" href="css/pages/dashboard.css" />
</head>
<body>
  <header class="cv-header">
    <div class="cv-header-inner">
      <div class="cv-brand">
        <img src="assets/short_logo.png" alt="CampusVault" class="cv-logo-sm" />
      </div>

      <button id="cv-hamburger" class="cv-hamburger" aria-label="Toggle menu">☰</button>

      <nav id="cv-topnav" class="cv-topnav" aria-label="Main navigation">
        <ul id="nav-list">
          <li><a href="student-dashboard.html" data-nav class="active">Dashboard</a></li>
          <li><a href="student_library.html" data-nav>Library</a></li>
          <li><a href="student_chat.html" data-nav>Chat</a></li>
          <li><a href="save.html" data-nav>Saved</a></li>
          <li><a href="profile.html" data-nav>Profile</a></li>
          <li><a href="complaint.html" data-nav>Complaint</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="cv-container">
    <section class="cv-card" id="student-welcome">
      <h2>Student Dashboard</h2>
      <p id="greeting">Loading student data...</p>
    </section>

    <section class="cv-card" id="student-overview">
      <h3>Your Courses & Resources</h3>
      <div id="resource-list" class="cv-list">
        <!-- populated by JS -->
      </div>
    </section>

    <section class="cv-card" id="student-latest">
      <h3>Latest uploads</h3>
      <div id="latest-uploads" class="cv-list"></div>
    </section>

    <section class="cv-card" id="student-actions">
      <h3>Quick Actions</h3>
      <div class="cv-actions">
        <button id="btn-search-library" class="cv-btn">Search Library</button>
        <button id="btn-open-chat" class="cv-btn">Open Chat</button>
        <button id="btn-raise-complaint" class="cv-btn">Raise Complaint</button>
      </div>
    </section>
  </main>

<!-- Floating Complaint Button -->
<button id="complaint-float-btn" class="cv-float-btn" title="Raise Complaint">!</button>

<!-- Complaint Popup Modal -->
<div id="complaint-modal" class="cv-modal">
  <div class="cv-modal-content">
    <span id="close-complaint-modal" class="cv-modal-close">&times;</span>
    <h3>Raise a Complaint</h3>
    <form id="complaint-form" action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
      <label for="student-name">Name</label>
      <input type="text" id="student-name" name="name" placeholder="Your Name" required />

      <label for="student-email">Email</label>
      <input type="email" id="student-email" name="email" placeholder="Your Email" required />

      <label for="complaint-message">Message</label>
      <textarea id="complaint-message" name="message" placeholder="Type your complaint..." required></textarea>

      <button type="submit" class="cv-btn">Send Complaint</button>
    </form>
    <p id="complaint-feedback" class="cv-feedback"></p>
  </div>
</div>


  <!-- Shared scripts -->
  <script type="module" src="js/config.js"></script>
  <script type="module" src="js/lib/dom.js"></script>
  <script type="module" src="js/api.js"></script>
  <script type="module" src="js/state.js"></script>
  <script type="module" src="js/auth.js"></script>
  <script type="module" src="js/ui.js"></script>

  <!-- Page controller -->
  <script type="module" src="js/pages/dashboard.student.js"></script>
</body>
</html>
