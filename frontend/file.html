<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>CampusVault — File</title>

  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/pages/file.css" />
</head>
<body>
  <header class="cv-header-small">
    <div class="cv-header-inner">
      <a class="cv-back" href="library.html">&larr; Back</a>
      <h1 id="file-title-header">File</h1>
      <div></div>
    </div>
  </header>

  <main class="cv-container">
    <section class="cv-card" id="file-meta">
      <!-- JS populates file metadata and download link -->
    </section>

    <section class="cv-card" id="file-discussion">
      <h3>Discussion / Questions</h3>
      <div id="discussion-list" class="cv-list"></div>

      <form id="question-form" class="cv-form" novalidate>
        <label class="cv-field">
          <span class="cv-label">Ask a question</span>
          <textarea id="question-text" rows="3" required></textarea>
        </label>
        <div class="cv-actions">
          <button class="cv-btn" type="submit">Send</button>
        </div>
      </form>
    </section>
  </main>

  <script src="js/config.js"></script>
  <script src="js/lib/dom.js"></script>
  <script src="js/api.js"></script>
  <script src="js/state.js"></script>
  <script src="js/ui.js"></script>

  <script src="js/pages/file.page.js"></script>
</body>
</html>
