<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>CampusVault — Dashboard</title>

  <!-- Global styles -->
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />

  <!-- Page styles -->
  <link rel="stylesheet" href="css/pages/dashboard.css" />
</head>
<body>
  <header class="cv-header">
    <div class="cv-header-inner">
      <div class="cv-brand">
        <img src="assets/logo.png" alt="CampusVault" class="cv-logo-sm" />
        <span class="cv-app-name">CampusVault</span>
      </div>

      <button id="cv-hamburger" class="cv-hamburger" aria-label="Toggle menu">☰</button>

      <nav id="cv-topnav" class="cv-topnav" aria-label="Main navigation">
        <ul>
          <li><a href="dashboard.html" data-nav>Dashboard</a></li>
          <li><a href="library.html" data-nav>Library</a></li>
          <li><a href="noticeboard.html" data-nav>Noticeboard</a></li>
          <li><a href="chat.html" data-nav>Chat</a></li>
          <li><a href="complaint.html" data-nav>Complaint</a></li>
          <li id="nav-upload"><a href="upload.html" data-nav>Upload</a></li>
          <li><a href="profile.html" data-nav>Profile</a></li>
          <li><button id="logout-btn" class="cv-btn-link">Logout</button></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="cv-container">
    <section id="dashboard-welcome" class="cv-card">
      <h2 id="dw-title">Welcome</h2>
      <p id="dw-subtitle">A quick overview of latest uploads & notices</p>
      <div id="dashboard-status" class="cv-grid">
        <!-- JS populates overview cards -->
      </div>
    </section>

    <section id="dashboard-latest" class="cv-card">
      <h3>Latest uploads</h3>
      <div id="latest-uploads" class="cv-list"></div>
    </section>
  </main>

  <!-- Shared scripts -->
  <script src="js/config.js"></script>
  <script src="js/lib/dom.js"></script>
  <script src="js/api.js"></script>
  <script src="js/state.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>

  <!-- Page controller -->
  <script src="js/pages/dashboard.page.js"></script>
</body>
</html>
