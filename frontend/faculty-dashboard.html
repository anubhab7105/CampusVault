<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>CampusVault — Faculty Dashboard</title>

  <!-- Global styles -->
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />

  <!-- Page styles -->
  <link rel="stylesheet" href="css/pages/dashboard.css" />
</head>
<body>
  <header class="cv-header">
    <div class="cv-header-inner">
      <div class="cv-brand">
        <img src="assets/logo.png" alt="CampusVault" class="cv-logo-sm" />
        <span class="cv-app-name">CampusVault</span>
      </div>

      <button id="cv-hamburger" class="cv-hamburger" aria-label="Toggle menu">☰</button>

      <nav id="cv-topnav" class="cv-topnav" aria-label="Main navigation">
        <ul id="nav-list">
          <li><a href="faculty-dashboard.html" data-nav class="active">Dashboard</a></li>
          <li><a href="library.html" data-nav>Library</a></li>
          <li><a href="noticeboard.html" data-nav>Noticeboard</a></li>
          <li><a href="chat.html" data-nav>Chat</a></li>
          <li><a href="course-materials.html" data-nav>Course Materials</a></li>
          <li id="nav-upload"><a href="upload.html" data-nav>Upload</a></li>
          <li><a href="profile.html" data-nav>Profile</a></li>
          <li><button id="logout-btn" class="cv-btn-link">Logout</button></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="cv-container">
    <section class="cv-card" id="faculty-welcome">
      <h2>Faculty Dashboard</h2>
      <p id="greeting">Loading faculty data...</p>
    </section>

    <section class="cv-card" id="faculty-overview">
      <h3>Your Courses</h3>
      <div id="course-list" class="cv-list">
        <!-- populated by JS -->
      </div>
    </section>

    <section class="cv-card" id="faculty-uploads">
      <h3>Recent uploads</h3>
      <div id="latest-uploads" class="cv-list"></div>
    </section>

    <section class="cv-card" id="faculty-actions">
      <h3>Quick Actions</h3>
      <div class="cv-actions">
        <button id="btn-upload-material" class="cv-btn">Upload Material</button>
        <button id="btn-post-notice" class="cv-btn">Post Notice</button>
        <button id="btn-contact-admin" class="cv-btn">Contact Admin</button>
      </div>
    </section>
  </main>

  <!-- Shared scripts (loaded as ES modules) -->
  <script type="module" src="js/config.js"></script>
  <script type="module" src="js/lib/dom.js"></script>
  <script type="module" src="js/api.js"></script>
  <script type="module" src="js/state.js"></script>
  <script type="module" src="js/auth.js"></script>
  <script type="module" src="js/ui.js"></script>

  <!-- Page controller (module) -->
  <script type="module" src="js/pages/dashboard.faculty.js"></script>
</body>
</html>
