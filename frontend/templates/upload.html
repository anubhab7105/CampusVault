<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>CampusVault — Upload</title>

  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/pages/upload.css" />
</head>
<body>
  <header class="cv-header-small">
    <div class="cv-header-inner">
      <a class="cv-back" href="dashboard.html">&larr; Back</a>
      <h1>Upload Material</h1>
      <div></div>
    </div>
  </header>

  <main class="cv-container">
    <section class="cv-card">
      <form id="upload-form" class="cv-form" enctype="multipart/form-data" novalidate>
        <label class="cv-field">
          <span class="cv-label">Title</span>
          <input id="file-title" name="title" required />
        </label>

        <label class="cv-field">
          <span class="cv-label">Description</span>
          <textarea id="file-desc" name="description" rows="4"></textarea>
        </label>

        <label class="cv-field">
          <span class="cv-label">File</span>
          <input id="file-input" name="file" type="file" accept=".pdf,.ppt,.pptx,.doc,.docx,.xlsx,.xls" required />
        </label>

        <div class="cv-actions">
          <button id="upload-btn" class="cv-btn cv-btn-primary" type="submit">Upload</button>
          <span id="upload-status" class="cv-small"></span>
        </div>
      </form>
    </section>

    <section id="my-uploads-section" class="cv-card">
      <h3>My Uploads</h3>
      <div id="my-uploads-list" class="cv-list"></div>
    </section>
  </main>

  <script type="module" src="js/config.js"></script>
  <script type="module" src="js/lib/dom.js"></script>
  <script type="module" src="js/api.js"></script>
  <script type="module" src="js/state.js"></script>
  <script type="module" src="js/ui.js"></script>

  <script type="module" src="js/pages/upload.page.js"></script>
</body>
</html>
