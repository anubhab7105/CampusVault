<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>CampusVault — Admin Dashboard</title>

  <!-- Global styles -->
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />

  <!-- Page styles -->
  <link rel="stylesheet" href="css/pages/dashboard.css" />
</head>
<body>
  <!-- Header / Nav: shared across dashboards.
       Backend can inject role-specific nav items OR use client-side role enforcement below. -->
  <header class="cv-header">
    <div class="cv-header-inner">
      <div class="cv-brand">
        <img src="assets/short_logo.png" alt="CampusVault" class="cv-logo-sm" />
      </div>

      <button id="cv-hamburger" class="cv-hamburger" aria-label="Toggle menu">☰</button>

      <nav id="cv-topnav" class="cv-topnav" aria-label="Main navigation">
        <ul id="nav-list">
          <li><a href="admin-dashboard.html" data-nav class="active">Dashboard</a></li>
          <li><a href="admin-users.html" data-nav>Users</a></li>
          <li><a href="admin-library.html" data-nav>Library (Manage)</a></li>
          <li><a href="noticeboard.html" data-nav>Noticeboard</a></li>
          <li><a href="reports.html" data-nav>Reports</a></li>
          <li id="nav-upload"><a href="upload.html" data-nav>Upload</a></li>
          <li><a href="profile.html" data-nav>Profile</a></li>
          <li><button id="logout-btn" class="cv-btn-link">Logout</button></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="cv-container">
    <!-- Welcome card -->
    <section class="cv-card" id="admin-welcome">
      <h2>Admin Dashboard</h2>
      <p class="muted" id="greeting">Loading admin data...</p>
    </section>

    <!-- Admin overview cards -->
    <section class="cv-card" id="admin-overview">
      <h3>Overview</h3>
      <div class="cv-grid" id="overview-grid">
        <!-- populated by JS -->
      </div>
    </section>

    <!-- Management panels -->
    <section class="cv-card" id="admin-actions">
      <h3>Quick Actions</h3>
      <div class="cv-actions">
        <button id="btn-manage-users" class="cv-btn">Manage Users</button>
        <button id="btn-manage-library" class="cv-btn">Manage Library</button>
        <button id="btn-system-reports" class="cv-btn">Generate Reports</button>
      </div>
    </section>

    <!-- Recent uploads / system logs -->
    <section class="cv-card" id="admin-latest">
      <h3>Recent uploads & logs</h3>
      <div id="latest-uploads" class="cv-list"></div>
    </section>
  </main>

  <!-- Shared scripts -->
  <script src="js/config.js"></script>
  <script src="js/lib/dom.js"></script>
  <script src="js/api.js"></script>
    <script type="module" src="js/state.js"></script>
    <script type="module" src="js/auth.js"></script>
    <script type="module" src="js/ui.js"></script>

  <!-- Page controller -->
    <script type="module" src="js/pages/dashboard.admin.js"></script>
</body>
</html>
