<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>CampusVault — Chat</title>

  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/pages/chat.css" />
</head>
<body>
  <header class="cv-header-small">
    <div class="cv-header-inner">
      <a class="cv-back" href="student-dashboard.html">&larr; Back</a>
    </div>
  </header>

  <div class="app">
    <aside class="sidebar">
      <div class="brand">CampusVault</div>
      <div class="users-section">
        <h4>Participants</h4>
        <div id="usersList" class="users-list"></div>
      </div>
    </aside>

    <main class="chat-area">
      <section id="messages" class="messages"></section>

      <form id="messageForm" class="composer" autocomplete="off">
        <input id="messageInput" type="text" placeholder="Write a message and press Enter" />
        <button type="submit">Send</button>
      </form>
    </main>
  </div>

  <script type="module" src="js/config.js"></script>
  <script type="module" src="js/lib/dom.js"></script>
  <script type="module" src="js/api.js"></script>
  <script type="module" src="js/state.js"></script>
  <script type="module" src="js/ui.js"></script>
  <script type="module" src="js/components/chatWidget.js"></script>
  <script type="module" src="js/pages/chat.page.js"></script>
</body>
</html>
