# CampusVault local development stack.
#
#   docker compose up --build
#
# Services:
#   backend   - Gunicorn + eventlet (API + Flask-SocketIO) on :8000
#   worker    - Celery worker (emails, malware scan, offline notifications)
#   redis     - Redis 7 (broker, results, rate limiting, presence, blocklists)
#   nginx     - reverse proxy + WebSocket upgrade on :80
#
# Notes:
#   - Supabase PostgreSQL is external to this compose file; set SUPABASE_DB_URL.
#   - No real secrets: all configuration via .env (copy from .env.example).

services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: campusvault-backend:dev
    container_name: cv-backend
    env_file:
      - ../backend/.env
    environment:
      - APP_ENV=development
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ../backend:/srv/app:ro
      - ./backend-data:/srv/app/instance
    command: python run.py
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: campusvault-backend:dev
    container_name: cv-worker
    env_file:
      - ../backend/.env
    environment:
      - APP_ENV=development
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A celery_app.celery_app worker -l info

  redis:
    image: redis:7-alpine
    container_name: cv-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  nginx:
    image: nginx:alpine
    container_name: cv-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/campusvault.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    command: /bin/sh -c "nginx -g 'daemon off;'"

volumes:
  redis-data:
