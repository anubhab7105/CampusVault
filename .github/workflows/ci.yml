name: CI

permissions:
  contents: read
  pull-requests: read

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements/*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/base.txt -r requirements/test.txt -r requirements/dev.txt

      - name: Lint (ruff)
        run: |
          pip install ruff
          ruff check app tests

      # Keep the existing project-wide typing backlog visible without blocking tests.
      # Current full-repo run reports 186 errors across 34 files; reduce this as modules are typed.
      - name: Type check (mypy, advisory)
        continue-on-error: true
        run: |
          pip install mypy
          mypy app

      - name: Test (pytest)
        env:
          APP_ENV: testing
          APP_SECRET_KEY: ci-test-secret-key
          JWT_SECRET_KEY: ci-test-jwt-key
        run: |
          PYTHONPATH=. python -m pytest --cov=app --cov-report=term --cov-report=xml --cov-fail-under=40

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.xml
          retention-days: 7

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npx eslint src tests --max-warnings 0

      - name: Type check (tsc)
        run: npx tsc --noEmit

      - name: Test (vitest)
        run: npx vitest run

      - name: Build (production bundle)
        run: npm run build

  dependency-audit-python:
    name: Python dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit

      - name: Audit backend dependency set
        run: |
          python -m pip install -r backend/requirements/base.txt -r backend/requirements/test.txt -r backend/requirements/dev.txt
          pip-audit --strict

  dependency-audit-npm:
    name: Frontend dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        working-directory: frontend
        run: npm ci

      # Fail on high/critical advisories. Moderate/low findings remain visible in the
      # JSON artifact and should be triaged; high/critical findings must not be ignored.
      - name: Audit high and critical vulnerabilities
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Save full npm audit report
        if: always()
        working-directory: frontend
        run: npm audit --json > npm-audit-report.json || test -s npm-audit-report.json

      - name: Upload npm audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: frontend/npm-audit-report.json
          retention-days: 14

  secret-scan:
    name: Secret scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Supplementary check only: the dependency graph feature must be enabled in
  # repository settings and DEPENDENCY_GRAPH_ENABLED must be set to "true".
  # The required pip-audit, npm audit, and Gitleaks jobs above always run.
  dependency-review:
    name: dependency review
    if: github.event_name == 'pull_request' && vars.DEPENDENCY_GRAPH_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Review dependency changes
        uses: actions/dependency-review-action@v4

  deploy:
    name: deploy preview
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker build + health check
        run: |
          docker compose -f docker/docker-compose.yml build
          docker compose -f docker/docker-compose.yml up -d
          sleep 5
          curl -fsS http://localhost:8000/health/live || exit 1
          curl -fsS http://localhost:8000/health/ready || exit 1
          docker compose -f docker/docker-compose.yml down
