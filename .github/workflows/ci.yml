name: CI

permissions:
  contents: read
  pull-requests: read

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements/*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/base.txt -r requirements/test.txt -r requirements/dev.txt

      - name: Lint (ruff)
        run: |
          pip install ruff
          ruff check app tests

      # Keep the existing project-wide typing backlog visible without blocking tests.
      # Current full-repo run reports 186 errors across 34 files; reduce this as modules are typed.
      - name: Type check (mypy, advisory)
        continue-on-error: true
        run: |
          pip install mypy
          mypy app

      - name: Test (pytest)
        env:
          APP_ENV: testing
          APP_SECRET_KEY: ci-test-secret-key
          JWT_SECRET_KEY: ci-test-jwt-key
        run: |
          PYTHONPATH=. python -m pytest --cov=app --cov-report=term --cov-report=xml --cov-fail-under=40

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.xml
          retention-days: 7

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npx eslint src tests --max-warnings 0

      - name: Type check (tsc)
        run: npx tsc --noEmit

      - name: Test (vitest)
        run: npx vitest run

      - name: Build (production bundle)
        run: npm run build

  security:
    name: security scan
    # Dependency review requires the repository Dependency graph feature.
    # Enable it under Settings > Security, then set this repository variable to "true".
    if: github.event_name == 'pull_request' && vars.DEPENDENCY_GRAPH_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dependency review
        uses: actions/dependency-review-action@v4

  deploy:
    name: deploy preview
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker build + health check
        run: |
          docker compose -f docker/docker-compose.yml build
          docker compose -f docker/docker-compose.yml up -d
          sleep 5
          curl -fsS http://localhost:8000/health/live || exit 1
          curl -fsS http://localhost:8000/health/ready || exit 1
          docker compose -f docker/docker-compose.yml down
