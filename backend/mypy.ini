[mypy]
ignore_missing_imports = True
disallow_untyped_defs = False
disallow_incomplete_withstatements = False

[mpyy]
ignore_missing_imports = True

# Third-party modules without type stubs
mypy_path = types-flask-cors types-passlib types-flask-migrate

[flask]
mypy = strict

[celery]
mypy = strict

[flask_cors]
mypy = off

[flask_mail]
mypy = off

[supabase]
mypy = off

[clamav]
mypy = off
