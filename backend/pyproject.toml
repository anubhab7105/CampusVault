[project]
name = "campusvault-backend"
version = "0.1.0"
description = "CampusVault academic library platform — Flask backend"
requires-python = ">=3.11"

# ---------------------------------------------------------------------------
# Tooling configuration
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q --strict-markers"
markers = [
    "unit: fast, isolated tests (no network, no DB)",
    "integration: tests that use the Flask test client and test database",
    "e2e: end-to-end flows driven through the HTTP API",
]
filterwarnings = ["error::DeprecationWarning"]

[tool.coverage.run]
source = ["app"]
omit = [
    "app/**/__init__.py",
    "app/schemas/*",
    "alembic/*",
]

[tool.coverage.report]
# Definition of Done: coverage never silently drops below the gate.
fail_under = 80
show_missing = true
skip_empty = true

# ---------------------------------------------------------------------------
# Lint (security-first, small modules)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "F", "W",     # pycodestyle / pyflakes
    "I",               # import order
    "B",               # bugbear (common footguns)
    "C4",              # comprehensions
    "S",               # bandit-style security calls
    "T20",             # no print statements
    "UP",              # modern syntax
    "PL",              # pandas-agnostic pylint basics
]
ignore = [
    "S101",  # assert in tests
    "PLR0913", # many args acceptable in service signatures
    "PLE1205", # logging exception formatting quirks
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]  # hardcoded fake secrets in fixtures only

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = false   # relax during scaffolding, tighten per feature
check_untyped_defs = true
plugins = []

[tool.black]
line-length = 100
